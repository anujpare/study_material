<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1f3f3">
  <meta name="description" content="A rigorous, interactive PETS Zero Knowledge tutorial: proofs, simulators, repetition, Sigma protocols, Schnorr, circuits and Fiat–Shamir.">
  <title>PETS · Zero Knowledge</title>
  <link rel="stylesheet" href="style.css?v=5">
  <script>
  window.MathJax = {
    tex: {inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']], processEscapes: true},
    svg: {fontCache: 'local'},
    startup: {typeset: false, ready: () => { MathJax.startup.defaultReady(); window.dispatchEvent(new Event('mathjax-ready')); }}
  };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script defer src="app.js?v=5"></script>
</head>
<body>
<div class="shell">
  <header class="head">
    <div class="toprow">
      <a class="brand" href="../" aria-label="Return to PETS chapter selection">← PETS</a>
      <select id="jump" class="pick" aria-label="Jump to a tutorial card">
        <option>Loading lessons…</option>
      </select>
    </div>
    <div class="headmeta">
      <span>Zero Knowledge · Guided tutorial</span>
      <strong id="counter" aria-live="polite">01 / 31</strong>
    </div>
    <div class="progress" aria-hidden="true"><div id="progress"></div></div>
  </header>
  <main id="lesson" class="main" tabindex="-1"><p class="loader">Loading the lesson…</p></main>
  <footer class="bottom" aria-label="Lesson navigation">
    <button class="arrow" type="button" id="previous" aria-label="Previous lesson" disabled>←</button>
    <div class="bottom-center">
      <span id="current-label">A claim and its witness</span>
      <span class="small">Previous / next with the arrow keys</span>
    </div>
    <button class="arrow" type="button" id="next" aria-label="Next lesson">→</button>
  </footer>
</div>
<noscript>
  <p>JavaScript is required for navigation and interactive demonstrations. Lesson files can be read individually:
  <a href="./card-01.html">Card 1</a> and <a href="./card-02.html">Card 2</a>.</p>
</noscript>
</body>
</html>
